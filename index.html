<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>World Whisper</title>
    <style>
      html, body { margin: 0; height: 100%; background: #232323; color: #e5e5e5; font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
      #app { display: flex; height: 100%; flex-direction: column; gap: 12px; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
      .release { border: 1px solid #e5e5e5; border-radius: 999px; padding: 4px 12px; font-weight: 700; letter-spacing: .08em; }
      #diagnostic { width: min(100%, 720px); max-height: 45vh; overflow: auto; margin: 0; padding: 12px; box-sizing: border-box; border: 1px solid #666; border-radius: 8px; background: #181818; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
      button { border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 16px; background: #333; color: #fff; font: inherit; }
      button:disabled { opacity: .5; }
      #location-diagnostic { width: min(100%, 720px); max-height: 35vh; overflow: auto; margin: 0; padding: 12px; box-sizing: border-box; border: 1px solid #507050; border-radius: 8px; background: #172017; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="release">WORLD WHISPER v0.5.1</div>
      <div>Phase 2開発操作：スマホから通知と消去を再現します。</div>
      <div>
        <button id="trigger-notification-button" type="button">通知を発生</button>
        <button id="dismiss-display-button" type="button">表示を消す</button>
      </div>
      <button id="location-diagnostic-button" type="button">現在地と時刻を診断</button>
      <pre id="location-diagnostic">未実行です。診断結果は保存・送信しません。</pre>
      <pre id="diagnostic">状態: 起動準備中</pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
