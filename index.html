<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>World Whisper</title>
    <style>
      html, body { margin: 0; height: 100%; background: #232323; color: #e5e5e5; font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
      #app { display: flex; height: 100%; flex-direction: column; gap: 12px; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
      .release { border: 1px solid #e5e5e5; border-radius: 999px; padding: 4px 12px; font-weight: 700; letter-spacing: .08em; }
      #diagnostic { width: min(100%, 720px); max-height: 45vh; overflow: auto; margin: 0; padding: 12px; box-sizing: border-box; border: 1px solid #666; border-radius: 8px; background: #181818; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="release">GESTURE DIAGNOSTICS v0.2.2</div>
      <div>操作後の生イベントを下に表示します。</div>
      <pre id="diagnostic">受信イベント数: 0
操作してイベント受信の有無を確認してください。</pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
